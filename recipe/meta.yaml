{% set version = "0.5.50" %}
{% set python_min = "3.11" %}

package:
  name: anemoi-datasets
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/anemoi-datasets/anemoi_datasets-{{ version }}.tar.gz
  sha256: 88964c4ebe1c1f249b2b0644dbc52418b50486a36679d9f0084e2974287b72c7

build:
  entry_points:
    - anemoi-datasets = anemoi.datasets.__main__:main
  noarch: python
  script: "{{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation"
  number: 1

requirements:
  host:
    - python {{ python_min }}.*
    - setuptools >=60
    - setuptools-scm >=8
    - pip
  run:
    - python >={{ python_min }}
    - anemoi-transform >=0.4
    - anemoi-utils >=0.5.12
    - cfunits
    - glom
    - jsonschema
    - lru-dict
    - numpy
    - pint
    - psutil
    - pydantic
    - pyyaml
    - rich
    - ruamel.yaml >=0.16
    - semantic_version
    - tqdm
    - zarr >=2,!=3.0.*,!=3.1.*,!=3.2.*,!=3.3.*,!=3.4

test:
  imports:
    - anemoi
  commands:
    - anemoi-datasets --help
  requires:
    - pip
    - python {{ python_min }}
    - pytest >=8.4.1
    - pytest-xdist >=3.7

about:
  home: https://github.com/ecmwf/anemoi-datasets/
  summary: A package to hold various functions to support training of ML models on ECMWF data.
  doc_url: https://anemoi-datasets.readthedocs.io/
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - tjtg
    - jasonjunweilyu
    - HCookie
